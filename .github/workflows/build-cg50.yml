name: Build RICE for fx-CG50

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/therainbowphoenix/gint-docker:main
      options: --user root
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify and extract RICE source
        run: |
          test -s RICE_Build_Source_Min.tar.xz
          tar -tJf RICE_Build_Source_Min.tar.xz
          tar -xJf RICE_Build_Source_Min.tar.xz
          test -f RICE_Advanced_Maths/CMakeLists.txt
          test -f RICE_Advanced_Maths/src/main.c
          test -f RICE_Advanced_Maths/src/mathcore.c
          test -f RICE_Advanced_Maths/assets/icon-uns.png
          test -f RICE_Advanced_Maths/assets/icon-sel.png

      - name: Locate prebuilt fxSDK and SuperH toolchain
        run: |
          export PATH="$HOME/.local/bin:/home/dev/.local/bin:/usr/local/bin:$PATH"
          if ! command -v fxsdk >/dev/null 2>&1; then
            SDK_BIN="$(find /home /opt /usr/local -type f -name fxsdk -perm -111 2>/dev/null | head -n 1 | xargs -r dirname)"
            test -n "$SDK_BIN"
            export PATH="$SDK_BIN:$PATH"
          fi
          if ! command -v sh-elf-gcc >/dev/null 2>&1; then
            GCC_BIN="$(find /home /opt /usr/local -type f -name sh-elf-gcc -perm -111 2>/dev/null | head -n 1 | xargs -r dirname)"
            test -n "$GCC_BIN"
            export PATH="$GCC_BIN:$PATH"
          fi
          command -v fxsdk
          command -v sh-elf-gcc
          sh-elf-gcc --version
          fxsdk path sysroot

      - name: Build fx-CG50 add-in
        working-directory: RICE_Advanced_Maths
        run: |
          export PATH="$HOME/.local/bin:/home/dev/.local/bin:/usr/local/bin:$PATH"
          fxsdk build-cg
          test -s RICE.g3a
          file RICE.g3a

      - name: Upload RICE.g3a
        uses: actions/upload-artifact@v4
        with:
          name: RICE-fx-CG50
          path: RICE_Advanced_Maths/RICE.g3a
          if-no-files-found: error
