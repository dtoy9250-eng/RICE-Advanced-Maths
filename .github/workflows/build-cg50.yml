name: Build RICE for fx-CG50

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host maths and keypad tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run strict host regression tests
        working-directory: RICE_Advanced_Maths
        run: sh tests/run_host_tests.sh

  build:
    name: Build calculator add-in
    needs: host-tests
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/therainbowphoenix/gint-docker:main
      options: --user root
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Locate fxSDK and SuperH toolchain
        working-directory: RICE_Advanced_Maths
        run: |
          export PATH="$HOME/.local/bin:/home/dev/.local/bin:/usr/local/bin:$PATH"
          if ! command -v fxsdk >/dev/null 2>&1; then
            SDK_BIN="$(find /home /opt /usr/local -type f -name fxsdk -perm -111 2>/dev/null | head -n 1 | xargs -r dirname)"
            test -n "$SDK_BIN"
            export PATH="$SDK_BIN:$PATH"
          fi
          if ! command -v sh-elf-gcc >/dev/null 2>&1; then
            GCC_BIN="$(find /home /opt /usr/local -type f -name sh-elf-gcc -perm -111 2>/dev/null | head -n 1 | xargs -r dirname)"
            test -n "$GCC_BIN"
            export PATH="$GCC_BIN:$PATH"
          fi
          command -v fxsdk
          command -v sh-elf-gcc
          sh-elf-gcc --version
          fxsdk path sysroot
      - name: Build fx-CG50 add-in
        working-directory: RICE_Advanced_Maths
        run: |
          export PATH="$HOME/.local/bin:/home/dev/.local/bin:/usr/local/bin:$PATH"
          SDK_BIN="$(find /home /opt /usr/local -type f -name fxsdk -perm -111 2>/dev/null | head -n 1 | xargs -r dirname)"
          GCC_BIN="$(find /home /opt /usr/local -type f -name sh-elf-gcc -perm -111 2>/dev/null | head -n 1 | xargs -r dirname)"
          export PATH="$SDK_BIN:$GCC_BIN:$PATH"
          fxsdk build-cg
          test -s RICE.g3a
          ls -lh RICE.g3a
      - name: Upload RICE.g3a
        uses: actions/upload-artifact@v4
        with:
          name: RICE-fx-CG50
          path: RICE_Advanced_Maths/RICE.g3a
          if-no-files-found: error
