name: Build RICE for fx-CG50

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract RICE source archive
        run: |
          tar -xzf RICE_Source_Clean.tar.gz
          test -f RICE_Advanced_Maths/CMakeLists.txt
          test -f RICE_Advanced_Maths/src/main.c

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl git python3 python3-pil build-essential pkg-config cmake \
            libusb-1.0-0-dev libudev-dev libsdl2-dev libudisks2-dev \
            libglib2.0-dev libpng-dev libncurses-dev \
            libmpfr-dev libmpc-dev libgmp-dev libppl-dev flex texinfo openssl

      - name: Bootstrap GiteaPC
        run: |
          git clone --depth=1 https://git.planet-casio.com/Lephenixnoir/GiteaPC "$HOME/giteapc"
          cd "$HOME/giteapc"
          python3 giteapc.py install Lephenixnoir/GiteaPC -y
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install fxSDK and fx-CG50 toolchain
        run: |
          cd "$HOME/giteapc"
          python3 giteapc.py install Lephenixnoir/fxsdk@dev -y
          python3 giteapc.py install Lephenixnoir/sh-elf-binutils:clean -y
          python3 giteapc.py install Lephenixnoir/sh-elf-gcc:clean -y
          python3 giteapc.py install Lephenixnoir/sh-elf-gdb -y
          python3 giteapc.py install Lephenixnoir/OpenLibm -y
          python3 giteapc.py install Vhex-Kernel-Core/fxlibc@dev -y
          python3 giteapc.py install Lephenixnoir/sh-elf-gcc -y
          python3 giteapc.py install Lephenixnoir/gint@dev -y
          python3 giteapc.py install Lephenixnoir/JustUI@dev -y

      - name: Run host-side regression tests
        working-directory: RICE_Advanced_Maths
        run: make test

      - name: Build calculator add-in
        working-directory: RICE_Advanced_Maths
        run: |
          fxsdk build-cg
          test -f RICE.g3a

      - name: Upload RICE.g3a
        uses: actions/upload-artifact@v4
        with:
          name: RICE-fx-CG50
          path: RICE_Advanced_Maths/RICE.g3a
          if-no-files-found: error
