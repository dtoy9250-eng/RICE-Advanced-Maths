name: Build RICE for fx-CG50

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify and extract RICE source
        run: |
          test -s RICE_Build_Source_Min.tar.xz
          tar -tJf RICE_Build_Source_Min.tar.xz
          tar -xJf RICE_Build_Source_Min.tar.xz
          test -f RICE_Advanced_Maths/CMakeLists.txt
          test -f RICE_Advanced_Maths/src/main.c
          test -f RICE_Advanced_Maths/src/mathcore.c
          test -f RICE_Advanced_Maths/assets/icon-uns.png
          test -f RICE_Advanced_Maths/assets/icon-sel.png

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git python3 build-essential cmake pkg-config

      - name: Install GiteaPC non-interactively
        run: |
          curl -fsSL "https://git.planet-casio.com/Lephenixnoir/GiteaPC/raw/branch/master/install.sh" -o /tmp/giteapc-install.sh
          printf '\n' | bash /tmp/giteapc-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          command -v giteapc
          giteapc --help

      - name: Install documented fxSDK and SH-4 toolchain
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          giteapc install Lephenixnoir/fxsdk Lephenixnoir/sh-elf-binutils Lephenixnoir/sh-elf-gcc
          giteapc install Lephenixnoir/OpenLibm Vhex-Kernel-Core/fxlibc
          giteapc install Lephenixnoir/sh-elf-gcc
          giteapc install Lephenixnoir/gint
          command -v fxsdk
          command -v sh-elf-gcc

      - name: Build fx-CG50 add-in
        working-directory: RICE_Advanced_Maths
        run: |
          fxsdk build-cg
          test -s RICE.g3a
          file RICE.g3a

      - name: Upload RICE.g3a
        uses: actions/upload-artifact@v4
        with:
          name: RICE-fx-CG50
          path: RICE_Advanced_Maths/RICE.g3a
          if-no-files-found: error
